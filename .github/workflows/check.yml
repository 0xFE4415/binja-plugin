name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  check:
    needs: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Format
        run: uvx nox -s format
      - name: Ruff
        run: uvx nox -s ruff
      - name: Size gate
        run: uvx nox -s size
      - name: Type check
        run: uvx nox -s ty
      - name: Test
        run: uvx nox -s test

  native:
    needs: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache the cargo registry and git checkouts so the stub-core build only
      # recompiles what changed; keyed on native/Cargo.lock plus the workflow.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-targets: true
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt/archives
          key: apt-${{ runner.os }}-native-${{ hashFiles('.github/workflows/check.yml') }}
      - name: Install stub-core build prerequisites
        run: |
          mkdir -p "$HOME/.cache/apt/archives"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$HOME/.cache/apt/archives" \
            install -y clang cmake ninja-build
      - name: Run native checks
        run: uvx nox -s native

  mutation-python:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Run Python mutation gate
        run: uvx nox -s mutation

  mutation-native:
    needs: [check, native]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Cache the cargo registry/git databases; cargo-mutants builds each mutant
      # in its own scratch target dir, so only the dependency downloads are reusable.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt/archives
          key: apt-${{ runner.os }}-mutation-native-${{ hashFiles('.github/workflows/check.yml') }}
      - name: Install build prerequisites
        run: |
          mkdir -p "$HOME/.cache/apt/archives"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$HOME/.cache/apt/archives" \
            install -y clang cmake ninja-build jq mold
      # cargo-mutants links every mutant separately; mold cuts each link.
      - name: Speed up mutant linking
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      # Prebuilt binary instead of `cargo install --locked`, which compiled the
      # tool from source on every run; the version is pinned with the toolchain
      # to keep mutant outcomes reproducible.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run native mutation gate
        run: uvx nox -s mutation_native
