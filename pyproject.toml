[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binja-plugin"
version = "0.1.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "ty>=0.0.1",
    "ruff>=0.6",
    "nox>=2024.0",
]
all = [
    "binja-plugin[test,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=binja_plugin --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["binja_plugin"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["D"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
